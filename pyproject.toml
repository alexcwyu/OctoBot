[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "octobot"
version = "3.0.0b3"
description = "Cryptocurrencies alert / trading bot"
readme = "README.md"
requires-python = ">=3.13"
license = {text = "GPL-3.0"}
authors = [
    {name = "Drakkar-Software", email = "contact@drakkar.software"},
]
keywords = ["cryptocurrency", "trading", "bot", "bitcoin", "ethereum", "alert"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
]
dependencies = [
    "requests",
    "urllib3",
    "packaging",
    "python-dotenv",
    "setuptools",
    "jinja2",
    "PyYAML",
    "aioboto3",
    "cachetools",
    "standard-imghdr",
    "pgpy",
    "sentry-sdk",
    "supabase",
    "supabase_auth",
    "postgrest",
    "websockets",
    "aiohttp",
    "aiofiles",
    "aiodns",
    "numpy",
    "cryptography",
    "sortedcontainers",
    "pydantic",
    "typing_extensions",
    "OctoBot-Tulipy>=0.4.11b13",
    "fastapi",
    "uvicorn",
    "starlette",
    "passlib[bcrypt]",
    "dbos",
    "starfish-sdk>=3.0.0a72",
    "starfish-server>=3.0.0a72",
    "pydantic-settings",
    "starfish-identities>=3.0.0a72",
    "starfish-protocol>=3.0.0a72",
    "starfish-keyring>=3.0.0a72",
    "starfish-spaces>=3.0.0a72",
    "starfish-sharing>=3.0.0a72",
    "python-multipart",
    "web3",
    "octobot-ccxt",
]

[dependency-groups]
dev = [
    "pytest",
    "httpx2",
    "pytest-asyncio",
    "pytest-cov",
    "pytest-timeout",
    "pytest-xdist",
    "mock",
    "ruff",
]

[tool.uv]
default-groups = ["dev"]
override-dependencies = ["multidict>=6.9.1"]

[tool.uv.sources]
octobot-ccxt = { url = "https://github.com/Drakkar-Software/ccxt/archive/791e42d60faaa27306405919c27918dc056466f7.tar.gz" }

[project.urls]
Homepage = "https://github.com/Drakkar-Software/OctoBot"
Documentation = "https://www.octobot.cloud/en/guides"
Repository = "https://github.com/Drakkar-Software/OctoBot"
"Bug Tracker" = "https://github.com/Drakkar-Software/OctoBot/issues"

[project.scripts]
OctoBot = "octobot.cli:main"
octobot = "octobot.cli:main"

[tool.hatch.build.targets.wheel]
packages = [
    "src/octobot",
    "packages/backtesting/octobot_backtesting",
    "packages/commons/octobot_commons",
    "packages/agents/octobot_agents",
    "packages/protocol/octobot_protocol_ts",
    "packages/protocol/octobot_protocol",
    "packages/evaluators/octobot_evaluators",
    "packages/tentacles_manager/octobot_tentacles_manager",
    "packages/copy/octobot_copy",
    "packages/copy/octobot_copy_ts",
    "packages/node/octobot_node",
    "packages/sync/octobot_sync",
    "packages/async_channel/async_channel",
    "packages/trading/octobot_trading",
    "packages/client/octobot_client_ts",
    "packages/services/octobot_services",
    "packages/flow/octobot_flow",
]
include = ["src/start.py"]
dev-mode-dirs = ["src", "packages/backtesting", "packages/commons", "packages/agents", "packages/protocol", "packages/evaluators", "packages/tentacles_manager", "packages/copy", "packages/binary", "packages/node", "packages/sync", "packages/async_channel", "packages/trading", "packages/client", "packages/services", "packages/flow"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/packages",
    "/README.md",
    "/LICENSE",
]
exclude = [
    "**/node_modules/**",
    "**/__pycache__/**",
    "**/*.pyc",
    "**/.pytest_cache/**",
    "tests/**",
    "additional_tests/**",
    "docker/**",
]


[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "C4", "RUF", "PERF", "TC", "PTH"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]
"__init__.py" = ["F401"]

[tool.ruff.lint.isort]
known-first-party = ["octobot"]

[tool.pyright]
pythonVersion = "3.13"
typeCheckingMode = "basic"

[tool.pytest.ini_options]
minversion = "9.0"
addopts = ["-ra", "-q", "--strict-markers"]
testpaths = ["tests"]
pythonpath = ["src"]
xfail_strict = true
filterwarnings = ["error"]


[project.optional-dependencies]
full = [
    "colorlog",
    "gmqtt",
    "pgpy",
    "clickhouse-connect",
    "pydantic",
    "protobuf",
    "jsonschema",
    "psutil",
    "certifi",
    "tinydb",
    "aiosqlite",
    "flask",
    "flask-cors",
    "flask-login",
    "flask-wtf",
    "asgiref",
    "cython",
    "jinja2",
    "pyyaml",
    "aioboto3",
    "starfish-replica[space]>=3.0.0a72",
    "starfish-server",
    "cachetools",
    "web3",
    "asyncpraw",
    "python-telegram-bot",
    "simplifiedpytrends",
    "pyngrok",
    "werkzeug",
    "WTForms",
    "Flask-WTF",
    "uvicorn",
    "starlette",
    "openai",
    "mcp>=1.30,<2",
    "coingecko-openapi-client",
    "vaderSentiment",
]
